<main
	class="flex flex-col items-center justify-center min-h-screen px-wrapper gap-9 md:gap-16"
>
	<div
		class="flex flex-col items-center justify-center bg-surface-container rounded-2xl gap-9 p-12 w-full md:w-[400px] max-w-[90vw]"
	>
		<h1 class="font-extrabold text-2xl">Login</h1>
		<div class="flex flex-col items-center justify-center gap-6 w-full">
			<h2 class="font-medium text-base text-center">
				Log in with your Discord account to authenticate
			</h2>
			@if (!oAuthUrl) {
				<button
					disabled="true"
					class="text-on-primary w-full !py-6"
					mat-flat-button
				>
					<mat-progress-spinner
						diameter="24"
						mode="indeterminate"
					></mat-progress-spinner>
				</button>
			} @else {
				<a
					[href]="oAuthUrl"
					class="text-on-primary w-full !py-6"
					mat-flat-button
				>
			<ng-icon
				name="discord"
				size="24"
				class="text-on-primary !mr-4"
				aria-hidden="false"
				aria-label="Discord logo"
			></ng-icon>

					Login with Discord
				</a>
			}
		</div>

		@if (devMode) {
			<div class="flex flex-col items-center justify-center gap-6 w-full">
				<div class="flex w-1/4 h-[1px] bg-on-surface-variant"></div>
				<h2 class="font-medium text-sm text-on-surface-variant">
					Dev Mode — Test Login
				</h2>
				<mat-form-field appearance="outline" class="w-full">
					<mat-label>Select a user</mat-label>
					<mat-select [(ngModel)]="testUsername" [disabled]="testLoading">
						@for (user of seededUsers; track user) {
							<mat-option [value]="user">{{ user }}</mat-option>
						}
					</mat-select>
				</mat-form-field>
				@if (testError) {
					<p class="text-error text-xs">{{ testError }}</p>
				}
				<button
					(click)="onTestLogin()"
					[disabled]="!testUsername || testLoading"
					class="w-full !py-6"
					mat-stroked-button
				>
					@if (testLoading) {
						<mat-progress-spinner
							diameter="20"
							mode="indeterminate"
						></mat-progress-spinner>
					} @else {
						Test Login
					}
				</button>
			</div>
		}

		<div class="flex flex-col items-center justify-center gap-6 w-full">
			<div class="flex w-1/4 h-[1px] bg-on-surface-variant"></div>
			<p class="font-normal text-xs text-center">bscm &#64; 2026</p>
		</div>
	</div>
</main>
