<main
	class="flex flex-col-reverse md:flex-row items-start justify-center w-full min-h-[calc(100vh-7rem)] px-wrapper pt-9 pb-14 gap-9 md:gap-16"
>
	<div class="flex flex-col gap-6 w-full md:w-1/3">
		<h2 class="text-2xl font-semibold">Settings</h2>
		<p class="text-on-surface-variant">
			Manage your account settings and preferences.
		</p>
	</div>

	<div class="flex flex-col gap-6 w-full md:w-2/3">
		<mat-tab-group dynamicHeight>
			<mat-tab label="Account">
				<app-settings-wrapper>
					<app-settings-card
						title="Cloud uploading"
						description="With cloud uploading enabled, charts will automatically be uploaded to your Google Drive cloud."
					>
						<card-footer-label>
							Your Google Drive account must be connected to
							enable cloud uploading
						</card-footer-label>
						<card-footer>
							<mat-slide-toggle
								labelPosition="before"
								[(ngModel)]="isChecked"
								>Enabled</mat-slide-toggle
							>
						</card-footer>
					</app-settings-card>
					<app-settings-card
						title="Delete Account"
						description="Once you delete your account, there is no going back. All the content you upload will be removed. Please be certain"
						variant="destructive"
					>
						<card-footer>
							<button
								mat-flat-button
								class="!bg-error-container !text-on-error-container"
								(click)="deleteAccount()"
							>
								Delete account
							</button>
						</card-footer>
					</app-settings-card>
				</app-settings-wrapper>
			</mat-tab>
			<mat-tab label="Connections">
				<app-settings-wrapper>
					<app-settings-card
						class="w-full"
						title="Google Drive"
						description="Connect your Google Drive account to directly upload content"
						[showFooter]="false"
					>
						<card-content class="w-full">
							<button
								class="!w-full mt-2 !bg-surface-container-high"
								mat-button
								(click)="connectGoogleDrive()"
							>
								<mat-icon
									svgIcon="google"
									aria-hidden="false"
									aria-label="Google logo"
								></mat-icon>
								Continue with Google
							</button>
						</card-content>
					</app-settings-card>
				</app-settings-wrapper>
			</mat-tab>
		</mat-tab-group>
	</div>
</main>
