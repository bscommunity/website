<main
	class="flex flex-col items-start justify-start gap-wrapper md:gap-12 w-full min-h-screen px-wrapper py-wrapper md:py-12 text-base font-normal leading-5"
>
	<header class="flex flex-col items-start justify-start gap-6 w-full">
		<button mat-stroked-button routerLink="/workshop">
			<mat-icon class="align-middle mr-2">arrow_left_alt</mat-icon>
			Return to workshop
		</button>
		<div
			class="flex flex-col items-start justify-start w-full bg-surface-container rounded-3xl"
		>
			<div class="flex flex-col w-full relative">
				<img
					src="https://i.imgur.com/UNrwI2K.jpeg"
					alt="Profile banner"
					class="w-full h-64 object-cover rounded-3xl"
				/>
				<svg
					width="123"
					height="123"
					viewBox="0 0 123 123"
					class="absolute bottom-4 left-4"
				>
					<defs>
						<mask
							id="avatar-shape"
							maskContentUnits="userSpaceOnUse"
						>
							<use
								href="/assets/icons/avatar-mask.svg#avatar-border"
								fill="white"
							/>
						</mask>
					</defs>
					<image
						href="https://i.imgur.com/5Hsj4tJ.jpeg"
						width="123"
						height="123"
						mask="url(#avatar-shape)"
					/>
					<use
						href="/assets/icons/avatar-mask.svg#avatar-border"
						fill="none"
						class="stroke-secondary"
						stroke-width="4"
						stroke-linejoin="round"
						vector-effect="non-scaling-stroke"
					/>
				</svg>
			</div>
			<div
				class="flex flex-row flex-wrap md:justify-between w-full items-start justify-start p-9 gap-9"
			>
				<span
					class="flex flex-row flex-wrap items-center justify-start gap-2 md:gap-6"
				>
					<h1 class="text-2xl font-medium">@{{ this.username }}</h1>
					<!-- badges will come here -->
					<ul
						class="flex flex-row flex-wrap items-center justify-start gap-3"
					>
						<li>
							<app-badge icon="editor_choice" label="Verified" />
						</li>
						<li>
							<app-badge icon="deblur" label="High Quality" />
						</li>
						<li>
							<app-badge icon="music_note" label="+25 charts" />
						</li>
					</ul>
				</span>
				<div class="flex items-center justify-start gap-4">
					<button mat-flat-button>
						<mat-icon class="align-middle mr-2"
							>stars_filled</mat-icon
						>
						Follow
					</button>
					<button
						class="flex flex-row items-center justify-center rounded-full py-2 px-3 bg-primary text-xl text-on-primary hover:brightness-90 disabled:opacity-50"
						matRipple
						matRippleColor="rgba(63, 30, 104, 0.1)"
						aria-label="Share"
					>
						<mat-icon class="align-middle" inline>share</mat-icon>
					</button>
					<button
						class="flex flex-row items-center justify-center rounded-full py-2 px-3 bg-primary text-xl text-on-primary hover:brightness-90 disabled:opacity-50"
						matRipple
						matRippleColor="rgba(63, 30, 104, 0.1)"
						aria-label="Report"
					>
						<mat-icon class="align-middle" inline>flag</mat-icon>
					</button>
				</div>
			</div>
		</div>
	</header>

	<section class="flex flex-col gap-6 w-full">
		<nav mat-tab-nav-bar [tabPanel]="tabPanel">
			@for (tab of tabs; track tab.value) {
				<div
					mat-tab-link
					[attr.aria-current]="
						currentTab === tab.value ? 'page' : null
					"
					[active]="currentTab === tab.value"
					(click)="currentTab = tab.value"
					(keyup)="currentTab = tab.value"
					tabindex="0"
					[ariaLabel]="tab.label"
				>
					<mat-icon
						class="align-middle mr-2 transition-opacity duration-200"
						[class.opacity-100]="currentTab === tab.value"
						[class.opacity-50]="currentTab !== tab.value"
					>
						{{ tab.icon }}
					</mat-icon>
				</div>
			}
		</nav>

		<mat-tab-nav-panel #tabPanel class="relative">
			@if (currentTab === tabs[0].value) {
				<app-tab-content-wrapper
					class="absolute top-0 left-0 flex flex-col w-full"
					animate.enter="slide-in-left"
					animate.leave="slide-out-left"
				>
					<div
						class="flex flex-col items-start justify-start bg-red-500 overflow-hidden"
					>
						<p>teste</p>
					</div>
				</app-tab-content-wrapper>
			} @else if (currentTab === tabs[1].value) {
				<app-tab-content-wrapper
					class="absolute top-0 left-0 flex flex-col w-full"
					animate.enter="slide-in-right"
					animate.leave="slide-out-right"
				>
					<div
						class="flex flex-col items-start justify-start bg-red-500 w-full overflow-hidden"
					>
						<p>teste</p>
					</div>
				</app-tab-content-wrapper>
			}
		</mat-tab-nav-panel>
	</section>
</main>
