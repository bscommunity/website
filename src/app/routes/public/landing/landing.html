<div
	class="w-full flex flex-col items-center justify-center gap-4 text-center mt-12"
>
	<div
		class="bg-[length:40px_40px] bg-[linear-gradient(to_right,var(--mat-sys-outline-variant)_1px,transparent_1px),linear-gradient(to_bottom,var(--mat-sys-outline-variant)_1px,transparent_1px)] absolute top-0 left-0 w-full h-full pointer-events-none -z-50 mask-radial-from-0% mask-radial-to-75% mask-radial-at-center opacity-30"
	></div>

	<div class="px-8">
		<app-landing-tag
			class="flex items-center justify-center"
			[label]="releaseLabel"
			[text]="desktopReleaseText"
			[mobileText]="mobileReleaseText"
			href="/changelog"
		/>
	</div>

	<!-- Debug button -->
	<!-- <button mat-button (click)="toggleDebug()" class="mt-4">
		Debug: {{ isDebugMode ? 'Texts Undefined' : 'Texts Normal' }}
	</button> -->

	<h1 class="text-[46px] font-extrabold leading-tight px-8 mt-6 md:max-w-lg">
		Keep the beat going your own way
	</h1>
	<h2 class="font-normal tracking-wide text-lg px-12 md:max-w-lg">
		Your hub for discovering, downloading, and managing community-made
		charts, tourpasses, and themes
	</h2>

	<div
		class="flex flex-row items-center justify-center gap-4 mt-4 flex-wrap px-8"
	>
		<a
			mat-flat-button
			href="https://github.com/bscommunity/android/releases/latest/download/app-release.apk"
		>
			<div class="flex flex-row items-center justify-center gap-2">
				<span
					class="flex self-center text-lg text-inherit leading-none select-none"
				>
					<mat-icon inline> download </mat-icon>
				</span>
				Download app
			</div>
		</a>
		<button mat-stroked-button routerLink="/dashboard">
			Open dashboard
		</button>
	</div>

	<div
		class="flex flex-row items-start justify-center w-full overflow-hidden h-80 md:h-115 mt-8 pt-12"
	>
		<img
			src="assets/images/landing/workshop.png"
			alt="Workshop screen"
			class="w-44 md:w-85 mt-8 md:mt-16 -mr-8 md:-mr-16 z-0 outline-8 md:outline-12 outline-black rounded-xl object-contain not-dark:hidden"
		/>
		<img
			src="assets/images/landing/details.png"
			alt="Workshop screen"
			class="w-44 md:w-85 shadow-lg z-10 outline-8 md:outline-12 outline-black rounded-xl object-contain not-dark:hidden"
		/>
		<img
			src="assets/images/landing/updates.png"
			alt="Workshop screen"
			class="w-44 md:w-85 mt-8 md:mt-16 z-0 -ml-8 md:-ml-16 outline-8 md:outline-12 outline-black rounded-xl object-contain not-dark:hidden"
		/>
		<img
			src="assets/images/landing/light/workshop.png"
			alt="Workshop screen"
			class="w-44 md:w-85 mt-8 md:mt-16 -mr-8 md:-mr-16 z-0 outline-8 md:outline-12 outline-gray-900 rounded-xl object-contain dark:hidden"
		/>
		<img
			src="assets/images/landing/light/details.png"
			alt="Workshop screen"
			class="w-44 md:w-85 shadow-lg z-10 outline-8 md:outline-12 outline-gray-900 rounded-xl object-contain dark:hidden"
		/>
		<img
			src="assets/images/landing/light/updates.png"
			alt="Workshop screen"
			class="w-44 md:w-85 mt-8 md:mt-16 z-0 -ml-8 md:-ml-16 outline-8 md:outline-12 outline-gray-900 rounded-xl object-contain dark:hidden"
		/>
	</div>
</div>
