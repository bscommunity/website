<main
	class="flex flex-col items-start justify-center gap-wrapper md:gap-12 w-full min-h-screen px-wrapper py-wrapper md:py-12 text-base font-normal leading-5"
>
	<header
		class="flex flex-col items-start justify-start gap-9 md:max-w-[65%]"
	>
		<h1 class="font-medium text-5xl md:text-6xl">Privacy Policy</h1>
		<p>
			Hello, community!<br />
			This app was lovingly developed for all the community to share fun
			and authentic content. <br />
			Here, we explain in simple terms how we handle the data you share.
		</p>
	</header>

	<div class="flex w-full h-px bg-surface-container-high"></div>

	<app-terms-template
		class="w-full"
		baseUrl="/privacy"
		[sections]="sections"
	></app-terms-template>

	<app-large-panel
		class="w-full"
		title="Don’t have the app installed?"
		message="Check Discord to get the most recent version and simplify your experience!"
		[button]="{ label: 'Discord', link: 'https://discord.gg/C5yCfnTAKz' }"
	></app-large-panel>
</main>
