<main
	class="flex flex-col items-center justify-star gap-wrapper md:gap-12 w-full min-h-screen px-wrapper py-wrapper pb-20 text-base font-normal leading-5 md:max-w-6xl mx-auto"
>
	<header class="flex flex-col items-start justify-start gap-9 w-full">
		<h1 class="font-medium text-5xl md:text-6xl">Release Notes</h1>
		<div
			class="bg-[length:40px_40px] bg-[linear-gradient(to_right,var(--mat-sys-outline-variant)_1px,transparent_1px),linear-gradient(to_bottom,var(--mat-sys-outline-variant)_1px,transparent_1px)] absolute top-0 left-0 w-full h-120 pointer-events-none -z-50 mask-radial-from-0% mask-radial-to-75% mask-radial-at-top opacity-30"
		></div>
	</header>

	<div class="flex w-full h-px bg-surface-container-high"></div>

	@if (releaseNotes() !== undefined) { @if (releaseNotes()!.length === 0) {
	<p class="text-on-background text-base font-normal">
		No release notes available.
	</p>
	} @else { @for (release of releaseNotes(); track $index) {
	<app-release-template
		class="w-full"
		[release]="release"
		[isLast]="releaseNotes()!.length - 1 === $index"
		[icon]="getRandomEmoji()"
	></app-release-template>
	} } } @else {
	<p class="text-on-background text-base font-normal">
		Loading release notes...
	</p>
	}
</main>
