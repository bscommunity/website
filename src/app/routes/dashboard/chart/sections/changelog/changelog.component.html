<app-chart-section class="w-full" title="Changelog">
	<ul
		class="flex flex-col items-start justify-start w-full rounded-lg bg-surface-container border border-inverse-on-surface overflow-hidden"
	>
		@if (entries().length > 0) {
			@for (entry of entries(); track $index) {
				<li
					class="flex flex-row items-center justify-between w-full gap-2 font-normal px-4 py-2 text-sm"
					[ngClass]="{
						'border-b border-b-inverse-on-surface':
							$index !== entries().length - 1,
					}"
				>
					<span>• {{ entry.description }}</span>
					<div class="flex flex-row items-center justify-end gap-2">
						<button
							mat-icon-button
							matTooltip="Close entry"
							matTooltipPosition="above"
							matTooltipShowDelay="375"
							matTooltipClass="!text-sm"
							(click)="openRemoveEntryConfirmationDialog(entry)"
						>
							<span
								class="text-lg align-middle flex items-center justify-center self-center leading-none select-none"
							>
								<ng-glyph name="playlist_remove" />
							</span>
						</button>
					</div>
				</li>
			}
		} @else {
			<div
				class="flex flex-col items-center justify-center gap-4 w-full py-9"
			>
				<span class="text-4xl"
					><ng-glyph name="airwave" /></span
				>
				<h1 class="text-base font-medium">
					There are currently no changelog entries
				</h1>
				<p class="text-sm text-center">
					New entries will be listed here
				</p>
			</div>
		}
		@if (addEntryInputVisible()) {
			<li
				class="flex flex-row items-center justify-between w-full gap-2 font-normal px-4 py-2 text-sm border-t border-t-inverse-on-surface"
			>
				<span class="w-full animate-pulse">
					•
					<input
						id="addEntry"
						class="bg-transparent outline-none border-none w-3/4"
						[(ngModel)]="newEntry"
						(keydown.enter)="addEntry()"
						type="text"
						placeholder="Describe the entry..."
				/></span>
				<div class="flex flex-row items-center justify-end gap-2">
					<button
						mat-raised-button
						class="!bg-transparent"
						[disabled]="isLoading"
						(click)="cancelAddEntry()"
					>
						Cancel
					</button>
					<button
						mat-raised-button
						[disabled]="isLoading"
						(click)="addEntry()"
					>
						@if (isLoading) {
							<mat-progress-spinner
								mode="indeterminate"
								diameter="16"
							></mat-progress-spinner>
						} @else {
							<span
								class="flex flex-row items-center justify-center gap-1"
							>
								<ng-glyph name="playlist_add" />
								Add
							</span>
						}
					</button>
				</div>
			</li>
		}
	</ul>
	@if (!addEntryInputVisible()) {
		<span class="flex items-center justify-end w-full">
			<button mat-stroked-button (click)="addEntryInputVisible.set(true)">
				<ng-glyph name="add_playlist" />
				Add new entry
			</button>
		</span>
	}
</app-chart-section>
