<aside class="flex flex-col items-start justify-start gap-6 w-full">
	<div class="absolute top-0 left-0 md:relative w-full max-md:-z-10">
		<div class="relative overflow-hidden md:rounded-lg">
			<img
				class="w-full opacity-50 md:opacity-100 md:w-72 xl:w-96 aspect-square"
				[src]="chart().track.coverUrl"
				[alt]="chart().track.title"
			/>
			<app-difficulty-mark
				class="hidden md:flex"
				[difficulty]="chart().difficulty"
				[size]="96"
			></app-difficulty-mark>
			@if (this.chart().visibility === this.visibility.PRIVATE) {
				<div
					class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center w-full h-full bg-black/70"
				>
					<ng-glyph
						name="visibility_off"
						size="64"
						class="relative"
					/>
				</div>
			}
		</div>
		<div
			class="flex md:hidden absolute bottom-0 left-0 h-24 w-full bg-linear-to-b from-transparent to-background"
		></div>
	</div>
	<!-- Actions -->
	<app-aside-section class="w-full">
		<app-aside-container
			class="w-full cursor-pointer"
			asideContainerClass="hover:bg-surface-container-high transition-colors"
			icon="edit"
			info="Edit chart"
			(click)="openEditDialog()"
		></app-aside-container>
		<app-aside-container
			class="w-full cursor-pointer flex md:hidden"
			asideContainerClass="hover:bg-surface-container-high transition-colors"
			icon="share"
			info="Share"
			(click)="share()"
		></app-aside-container>
	</app-aside-section>

	<!-- Likes / Bookmarks -->
	<app-aside-section title="Stats" class="w-full">
		<div class="flex flex-row items-center justify-center gap-2 w-full">
			<app-aside-container
				class="flex-1"
				icon="favorite"
				[info]="abbreviateNumber(chart().likesCount)"
			></app-aside-container>
			<app-aside-container
				class="flex-1"
				icon="bookmark"
				[info]="abbreviateNumber(chart().bookmarksCount)"
			></app-aside-container>
		</div>
		<app-aside-container
			class="w-full"
			icon="download"
			[info]="abbreviateNumber(chart().downloadsSum)"
		></app-aside-container>
	</app-aside-section>

	<app-aside-section title="Chart Info" class="w-full">
		<app-aside-container
			class="w-full"
			icon="timer"
			[info]="transformDuration(chart().track.duration || 0)"
		></app-aside-container>
		<app-aside-container
			class="w-full"
			icon="music_note"
			[info]="chart().notesAmount + ' notes'"
		></app-aside-container>
	</app-aside-section>
	<app-aside-section title="Files" class="w-full">
		<a
			class="w-full"
			(click)="downloadBundle()"
			(keypress)="downloadBundle()"
		>
			<app-aside-container
				class="w-full"
				asideContainerClass="hover:bg-surface-container-low cursor-pointer"
				info="Download .zip"
				[isLoading]="isFetchingBundle()"
			></app-aside-container>
		</a>
	</app-aside-section>
</aside>
