<app-chart-section class="w-full" title="Contributors">
	<app-table #contributorTable
		class="w-full"
		[columns]="contributorsColumns"
		[data]="groupedContributors()"
		[actions]="isOwner() ? contributorsActions : []"
	 />
	@if (isOwner()) {
		<span class="flex items-center justify-end w-full">
			<button
				mat-stroked-button
				(click)="openAddContributorConfirmationDialog()"
			>
				<ng-glyph name="add" />
				Add new contributor
			</button>
		</span>
	}
</app-chart-section>
