@if (step() === "batch") {
	<app-publish-version-batch-files
		[disabled]="isLoading()"
		(canceled)="onCancel()"
		(skipped)="goToFilesStep()"
		(filesSelected)="onBatchFilesSelected($event)"
	/>
} @else {
	<app-publish-version-files
		[disabled]="isLoading()"
		(back)="goToBatchStep()"
		(submitted)="onFilesSubmitted($event)"
	/>
}
