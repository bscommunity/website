@if (step() === "batch") {
	<app-theme-assets-batch-upload
		[disabled]="isLoading()"
		cancelLabel="Cancel"
		confirmLabel="Next"
		(canceled)="onCancel()"
		(skipped)="goToFilesStep()"
		(filesSelected)="onBatchFilesSelected($event)"
	/>
} @else {
	<app-theme-assets-files-form
		[disabled]="isLoading()"
		submitLabel="Next"
		(back)="goToBatchStep()"
		(submitted)="onFilesSubmitted($event)"
	/>
}
