<ul class="flex flex-col items-start justify-start">
	@for (item of items; track $index) {
		<li class="flex flex-row items-stretch justify-between w-full">
			<!-- Deco -->
			<div class="flex flex-col items-center mr-4">
				<div
					class="w-5 h-5 rounded-full bg-on-secondary-container"
				></div>
				<div class="w-1 flex-1 bg-on-secondary-container"></div>
			</div>
			<!-- Items -->
			<ul class="flex flex-col items-center justify-center gap-3 pb-4">
				@for (chart of item.data; track $index) {
					<app-chart-preview
						[chart]="chart"
						[showContributors]="true"
					/>
				}
			</ul>
		</li>
	}
</ul>
