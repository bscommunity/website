<div
	class="flex flex-col items-start justify-start p-4 gap-4 bg-surface-container-low border border-inverse-on-surface rounded-2xl"
>
	<div class="px-6 pt-2 flex flex-row items-center justify-between w-full">
		<h6>Filters</h6>
		@if (hasActiveFilters()) {
			<button
				class="text-sm hover:underline text-on-surface-container-low/80"
				(click)="clearFilters()"
			>
				Clear
			</button>
		}
	</div>

	<div class="flex flex-col items-start justify-start gap-1 w-full">
		<app-expansion-panel
			class="w-full"
			title="Categories"
			[data]="categories()"
			(optionSelectionChange)="onSelectionChange('categories', $event)"
			[disabled]="true"
		></app-expansion-panel>

		<app-expansion-panel
			class="w-full"
			title="Difficulties"
			[data]="difficulties()"
			(optionSelectionChange)="onSelectionChange('difficulties', $event)"
			[disabled]="disabled()"
		></app-expansion-panel>

		<app-expansion-panel
			class="w-full"
			title="Genres"
			[data]="genres()"
			(optionSelectionChange)="onSelectionChange('genres', $event)"
			[disabled]="disabled()"
		></app-expansion-panel>

		<app-expansion-panel
			class="w-full"
			title="Versions"
			[data]="versions()"
			(optionSelectionChange)="onSelectionChange('versions', $event)"
			[disabled]="disabled()"
		></app-expansion-panel>

		<!-- <mat-expansion-panel
			class="!shadow-none w-full"
			[expanded]="datePanelOpenState"
			(opened)="datePanelOpenState.set(true)"
			(closed)="datePanelOpenState.set(false)"
		>
			<mat-expansion-panel-header>
				<mat-panel-title> Published at </mat-panel-title>
			</mat-expansion-panel-header>
			<app-month-picker class="flex w-full"></app-month-picker>
		</mat-expansion-panel> -->
	</div>
</div>
