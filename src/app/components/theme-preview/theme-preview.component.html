<div
	class="flex flex-col items-center justify-center bg-surface-container-low rounded-2xl p-4 w-full cursor-pointer hover:bg-surface-container-high transition-colors"
	[routerLink]="routerLink()"
	matRipple
>
	<div class="relative flex flex-row items-end justify-center w-full">
		<img
			[src]="theme().displayArtUrl"
			[alt]="theme().name"
			class="w-28 xl:w-32 object-fit rounded-md mb-2 border-3 border-secondary-container aspect-9/16"
		/>
		<img
			[src]="theme().coverUrl"
			class="w-18 h-18 xl:w-20 xl:h-20 object-fit rounded-md border-3 -ml-6 border-secondary-container aspect-square"
		/>
	</div>
	<div class="flex flex-col items-start justify-start w-full mt-2 gap-1">
		<p
			class="text-base font-semibold overflow-hidden text-ellipsis line-clamp-1"
		>
			{{ theme().name }}
		</p>
		<span class="inline-flex gap-1 items-center justify-start">
			<ng-glyph name="autorenew" size="16" class="text-on-surface" />
			<p class="text-sm font-medium line-clamp-1">
				{{ replacesName() }}
			</p>
		</span>
	</div>
</div>
