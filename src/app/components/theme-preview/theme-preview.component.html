<div
	class="flex flex-col items-center justify-center bg-surface-container-low rounded-2xl p-4 w-full cursor-pointer hover:bg-surface-container-high transition-colors"
	[routerLink]="routerLink()"
	matRipple
>
	@if (theme().coverUrl) {
		<img
			[src]="theme().coverUrl"
			[alt]="theme().name"
			class="w-full h-40 object-cover rounded-xl"
		/>
	} @else {
		<div
			class="w-full h-40 bg-surface-container rounded-xl flex items-center justify-center"
		>
			<ng-glyph
				name="palette"
				size="40"
				class="text-on-surface/30"
			/>
		</div>
	}
	<div class="flex flex-col items-start justify-start w-full mt-2 gap-1">
		<p class="text-sm font-medium truncate w-full">
			{{ theme().name }}
		</p>
		<p class="text-xs text-on-surface-variant">
			Replaces: {{ theme().replaces }}
		</p>
	</div>
	<div class="flex items-center justify-end w-full mt-1">
		<button
			mat-icon-button
			aria-label="Share"
			(click)="onShare($event)"
			(keypress)="onShare($event)"
			class="!w-8! !h-8!"
		>
			<ng-glyph name="share" size="18" />
		</button>
	</div>
</div>
