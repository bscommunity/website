<h2 mat-dialog-title>Submitting...</h2>
<mat-dialog-content
	class="mat-typography flex! items-start justify-start flex-col gap-4"
>
	<p>This usually takes a few seconds.</p>

	<mat-progress-spinner
		class="my-8! mx-auto"
		mode="indeterminate"
		diameter="48"
	/>

	<div
		class="rounded-lg bg-surface-container px-6 py-4 gap-4 flex w-full items-center overflow-hidden h-12 mb-4!"
	>
		<div
			class="flex items-center gap-2 flex-1 text-on-surface-variant"
			[class.animate-slide-fade]="showMessage()"
			[class.animate-slide-out]="!showMessage()"
		>
			<mat-icon class="!text-lg !w-7 !h-7">{{
				currentIcon()
			}}</mat-icon>
			<span class="text-sm font-medium">{{ currentMessage() }}</span>
		</div>
		<span class="flex gap-0.75 ml-auto!">
			<span class="dot" style="animation-delay: 0s"></span>
			<span class="dot" style="animation-delay: 0.15s"></span>
			<span class="dot" style="animation-delay: 0.3s"></span>
		</span>
	</div>
</mat-dialog-content>
