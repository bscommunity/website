<div class="relative">
	<div [ngClass]="fallbackClasses()">
		<span>
			{{ alt()?.charAt(0) }}
		</span>
	</div>
	<img
		[ngClass]="imageClasses()"
		[ngStyle]="{ visibility: imageLoaded() ? 'visible' : 'hidden' }"
		[src]="src()"
		[alt]="alt()"
		(load)="onLoad()"
		(error)="onError()"
	/>
</div>
