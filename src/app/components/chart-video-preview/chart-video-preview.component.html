@if (embedUrl()) {
	<button
		class="relative h-full w-full group cursor-pointer rounded-[28px] overflow-hidden"
		(click)="openVideo()"
	>
		<iframe
			[src]="embedUrl()"
			[style.pointer-events]="'none'"
			class="h-full w-full object-contain rounded-[28px] cursor-pointer z-30 relative"
			allowfullscreen
		>
			<div
				class="flex items-center justify-center h-full w-full rounded-[28px] bg-on-surface/10"
			>
				<p class="text-center text-sm px-3">
					Your browser does not support iframes.
				</p>
			</div>
		</iframe>
		<div
			class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none flex items-center justify-center z-50"
		>
			<svg
				xmlns="http://www.w3.org/2000/svg"
				class="h-16 w-16 text-white"
				fill="none"
				viewBox="0 0 24 24"
				stroke="currentColor"
			>
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
					d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
				/>
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
					d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
				/>
			</svg>
		</div>
		<div
			class="flex w-full h-full absolute top-0 left-0 bg-surface-container-high animate-pulse z-20"
		></div>
	</button>
} @else if (audioPreviewUrl()) {
	<div
		class="flex items-center justify-center h-full w-full rounded-[28px] bg-on-surface/10 relative"
	>
		<audio
			#audioElement
			[src]="audioPreviewUrl()"
			(timeupdate)="onTimeUpdate($event)"
			(loadedmetadata)="onLoadedMetadata($event)"
			(ended)="onEnded()"
			class="hidden"
		></audio>

		<button
			(click)="toggleAudio()"
			class="relative flex items-center justify-center w-32 h-32 group cursor-pointer"
			[attr.aria-label]="isPlaying() ? 'Pause audio' : 'Play audio'"
		>
			<!-- Progress circle -->
			<svg
				class="absolute inset-0 w-full h-full -rotate-90"
				viewBox="0 0 100 100"
			>
				<!-- Background circle -->
				<circle
					cx="50"
					cy="50"
					r="45"
					fill="none"
					stroke="currentColor"
					stroke-width="4"
					class="text-on-surface/20"
				/>
				<!-- Progress circle -->
				<circle
					cx="50"
					cy="50"
					r="45"
					fill="none"
					stroke="currentColor"
					stroke-width="4"
					class="text-primary transition-all duration-200"
					[style.stroke-dasharray]="283"
					[style.stroke-dashoffset]="283 - (283 * progress()) / 100"
					stroke-linecap="round"
				/>
			</svg>

			<!-- Play/Pause icon -->
			<div class="z-10 flex items-center justify-center">
				@if (isPlaying()) {
					<!-- Pause icon -->
					<svg
						xmlns="http://www.w3.org/2000/svg"
						class="h-12 w-12 text-primary group-hover:scale-110 transition-transform"
						fill="currentColor"
						viewBox="0 0 24 24"
					>
						<path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
					</svg>
				} @else {
					<!-- Play icon -->
					<svg
						xmlns="http://www.w3.org/2000/svg"
						class="h-12 w-12 text-primary group-hover:scale-110 transition-transform"
						fill="currentColor"
						viewBox="0 0 24 24"
					>
						<path d="M8 5v14l11-7z" />
					</svg>
				}
			</div>

			<!-- Animated audio visualizer -->
			@if (isPlaying()) {
				<div
					class="absolute inset-0 flex items-center justify-center gap-1 pointer-events-none"
				>
					<div
						class="w-1 bg-primary/30 rounded-full animate-audio-wave"
						style="height: 20%; animation-delay: 0ms"
					></div>
					<div
						class="w-1 bg-primary/30 rounded-full animate-audio-wave"
						style="height: 40%; animation-delay: 150ms"
					></div>
					<div
						class="w-1 bg-primary/30 rounded-full animate-audio-wave"
						style="height: 30%; animation-delay: 300ms"
					></div>
					<div
						class="w-1 bg-primary/30 rounded-full animate-audio-wave"
						style="height: 50%; animation-delay: 450ms"
					></div>
					<div
						class="w-1 bg-primary/30 rounded-full animate-audio-wave"
						style="height: 25%; animation-delay: 600ms"
					></div>
					<div
						class="w-1 bg-primary/30 rounded-full animate-audio-wave"
						style="height: 35%; animation-delay: 600ms"
					></div>
					<div
						class="w-1 bg-primary/30 rounded-full animate-audio-wave"
						style="height: 15%; animation-delay: 600ms"
					></div>
				</div>
			}
		</button>
	</div>
} @else {
	<div
		class="flex items-center justify-center h-full w-full rounded-[28px] bg-on-surface/10"
	>
		<p class="text-center text-sm px-3">No preview available.</p>
	</div>
}
