@switch (config().type) {
	@case ("text") {
		<mat-form-field
			class="w-full"
			appearance="outline"
			[subscriptSizing]="config().hint ? 'dynamic' : 'fixed'"
		>
			<mat-label>{{ config().label }}</mat-label>
			<input
				matInput
				[type]="getTextConfig().inputType || 'text'"
				[formControl]="control()!"
				[placeholder]="getTextConfig().placeholder || ''"
				(blur)="onBlur()"
			/>
			@if (control()?.invalid) {
				<mat-error [innerHTML]="errorMessage()"></mat-error>
			}
			@if (config().hint) {
				<mat-hint align="start">{{ config().hint }}</mat-hint>
			}
		</mat-form-field>
	}
	@case ("file") {
		<div class="flex flex-col gap-1">
			<app-file-field
				[key]="config().key"
				[title]="config().label"
				[accept]="getFileConfig().accept"
				[isInvalid]="control()?.invalid && control()?.touched"
				[fileName]="control()?.value?.name"
				(fileChange)="onFileChange($event)"
			/>
			@if (control()?.invalid && control()?.touched) {
				<div
					class="text-error text-[0.8rem] -mt-2 ml-4"
					[innerHTML]="errorMessage()"
				></div>
			} @else if (config().hint) {
				<div class="text-on-background text-[0.8rem] -mt-2 ml-4">
					{{ config().hint }}
				</div>
			}
		</div>
	}
}
