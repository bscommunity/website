@if (difficultyIcon) {
	<span
		class="absolute bottom-0 right-0 w-10 h-10 z-0 border-solid border-b-40 border-l-40 border-t-transparent border-r-transparent border-b-black border-l-transparent"
		[ngClass]="class()"
		[ngStyle]="{
			width: size() + 'px',
			height: size() + 'px',
			'border-bottom-width': size() + 'px',
			'border-left-width': size() + 'px',
		}"
	>
	</span>
	<img
		class="z-10 absolute bottom-0 -right-0.5 w-6 h-6"
		[ngClass]="class()"
		[ngStyle]="{
			width: size() * 0.6 + 'px',
			height: size() * 0.6 + 'px',
		}"
		[src]="difficultyIcon"
		alt="Difficulty badge icon"
	/>
}
