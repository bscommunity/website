<div
	class="flex flex-col bg-background py-6 gap-12 h-[calc(100vh-6rem)] mt-24 w-screen transition-all overflow-y-scroll"
	[attr.data-state]="isOpen ? 'open' : 'closed'"
>
	<div class="flex flex-col items-start justify-start gap-6 px-6 w-full">
		<app-mobile-menu-item
			class="w-full"
			[link]="'/'"
			[text]="'Home'"
			[icon]="'home'"
			[routerLinkActiveOptions]="{ exact: true }"
			(closeMenu)="onClose()"
		></app-mobile-menu-item>
		<app-mobile-menu-item
			class="w-full"
			[link]="'/workshop'"
			[text]="'Workshop'"
			[icon]="'library_music'"
			(closeMenu)="onClose()"
		></app-mobile-menu-item>
		<app-mobile-menu-item
			class="w-full"
			[link]="'/release-notes'"
			[text]="'Changelog'"
			[icon]="'deployed_code'"
			(closeMenu)="onClose()"
		></app-mobile-menu-item>
	</div>

	<div class="flex flex-col items-start justify-start gap-6 px-10.5">
		<h6 class="font-normal text-base text-on-secondary-container">
			Socials
		</h6>
		<app-mobile-menu-item
			[link]="'https://discord.gg/C5yCfnTAKz'"
			[text]="'Discord'"
			[svgIcon]="'discord'"
			(closeMenu)="onClose()"
			variant="link"
		></app-mobile-menu-item>
		<app-mobile-menu-item
			[link]="'https://github.com/bscommunity'"
			[text]="'GitHub'"
			[svgIcon]="'github'"
			(closeMenu)="onClose()"
			variant="link"
		></app-mobile-menu-item>
	</div>

	<div class="flex flex-col items-start justify-start gap-6 px-10.5">
		<h6 class="font-normal text-base text-on-secondary-container">
			Customization
		</h6>
		<app-mobile-menu-item
			class="w-full"
			[text]="'Theme'"
			[icon]="'format_paint'"
			(closeMenu)="onClose()"
			variant="simple"
		>
			<app-theme-picker></app-theme-picker>
		</app-mobile-menu-item>
	</div>

	<div class="flex flex-col items-start justify-start gap-6 px-10.5">
		<app-status-display></app-status-display>
	</div>
</div>
